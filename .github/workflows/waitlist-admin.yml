name: Waitlist admin (staging)

# Waitlist management for the Crevant STAGING Supabase project, through the
# restricted waitlist_admin login only. Someone starts it by hand from the
# Actions tab on main, types the staging project reference, and approves the
# "staging" environment. Every action prints counts only.
#
#   summary             totals, verified and unverified, participant groups,
#                       recent signups, status, waves, the switch
#   status              the switch and the approved notice version
#   delete              delete one person by waitlist id (from the Supabase
#                       dashboard), with their consent record, selections and
#                       any unaccepted invitation. No email is typed into GitHub.
#   purge               retention: delete entries older than N months (12)
#   set-notice-version  record the approved privacy notice version
#   open                open submissions (refused without a notice version)
#   close               close submissions at once (emergency: see
#                       docs/WAITLIST-OPERATIONS.md for the direct fallback)
#   wave-preview        how many verified entries could be picked, by group
#   wave-select         pick up to N verified entries for a wave, by group,
#                       with reasons. Unverified entries are never picked.
#                       Shortlists only: sends nothing, invites no one.
#   wave-summary        counts for one wave
#   wave-clear          undo a wave
#
# Creator acquisition (only once migration 20261116000000 is approved and
# applied; until then these actions fail harmlessly):
#   accept-creator      accept a creator into the pilot by account id
#   creator-status      accept, pause or remove a creator (pausing stops
#                       their links at once)
#   creator-public-name the name shown on their links, only after they agreed;
#                       empty withdraws it
#   issue-link          a new link (90 days unless set otherwise); prints the
#                       code once. Codes are meant to be shared publicly by
#                       the creator, so the run log holding one is accepted.
#   revoke-link         revoke a link for good
#   acquisition-summary counts only; visits are estimates
#
# Retention runs only when someone starts "purge" by hand. There is no
# scheduled deletion (docs/WAITLIST-OPERATIONS.md explains the options for
# automating it after launch, which need a separate decision).
#
# Safety: the only credential is the staging environment's
# WAITLIST_ADMIN_DATABASE_URL (the restricted waitlist_admin login), and
# scripts/db/verify-staging-target.sh must confirm the target and the login
# before anything runs.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "What to do. Everything prints counts only."
        type: choice
        options:
          - summary
          - status
          - delete
          - purge
          - set-notice-version
          - open
          - close
          - wave-preview
          - wave-select
          - wave-summary
          - wave-clear
          - accept-creator
          - creator-status
          - creator-public-name
          - issue-link
          - revoke-link
          - acquisition-summary
        default: summary
        required: true
      waitlist_id:
        description: "For delete: the waitlist id (UUID) from the Supabase dashboard. Never an email address."
        type: string
        required: false
      retention_months:
        description: "For purge: months since signup or last verified confirmation (approved proposal: 12)."
        type: string
        default: '12'
        required: false
      notice_version:
        description: "For set-notice-version: the approved privacy notice version, e.g. notice-2026-11."
        type: string
        required: false
      wave:
        description: "For wave actions: the wave name, e.g. wave_1."
        type: string
        required: false
      group:
        description: "For wave-preview and wave-select: which participant group."
        type: choice
        options:
          - any
          - active_creator
          - aspiring_creator
          - supporter
        default: any
      reasons:
        description: "For wave-select: the approved selection reasons."
        type: choice
        options:
          - group_balance
          - targeted_feedback
          - both
        default: group_balance
      count:
        description: "For wave-select: how many to pick (1 to 100)."
        type: string
        default: '10'
        required: false
      creator_user_id:
        description: "For creator actions: the creator's account id (UUID) from the Supabase dashboard. Never an email address."
        type: string
        required: false
      categories:
        description: "For accept-creator: up to three of food, money, travel, tech, music, art, fitness, books, wellness, comma separated."
        type: string
        required: false
      creator_status:
        description: "For creator-status."
        type: choice
        options:
          - accepted
          - paused
          - removed
        default: paused
      public_name:
        description: "For creator-public-name: only a name the creator has agreed to show. Leave empty to withdraw it."
        type: string
        required: false
      link_days:
        description: "For issue-link: days until it expires (1 to 365)."
        type: string
        default: '90'
        required: false
      campaign:
        description: "For issue-link: an optional label, e.g. pilot_wave_1."
        type: string
        required: false
      link_code:
        description: "For revoke-link: the 20 character code."
        type: string
        required: false
      confirm_project_ref:
        description: "Type the staging project reference to confirm: kpudeppgokpjhvaqrprn"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: waitlist-admin-staging
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_REF: kpudeppgokpjhvaqrprn

jobs:
  admin:
    name: Waitlist ${{ inputs.action }} (staging)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Verify the target is the approved staging project and the restricted admin login
        env:
          STAGING_DATABASE_URL: ${{ secrets.WAITLIST_ADMIN_DATABASE_URL }}
          EXPECTED_DB_USER: waitlist_admin
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
        run: scripts/db/verify-staging-target.sh

      - name: Run the action
        env:
          DATABASE_URL: ${{ secrets.WAITLIST_ADMIN_DATABASE_URL }}
          REQUIRE_ADMIN_ROLE: '1'
          ACTION: ${{ inputs.action }}
          RETENTION_MONTHS: ${{ inputs.retention_months }}
          WAITLIST_ID: ${{ inputs.waitlist_id }}
          NOTICE_VERSION: ${{ inputs.notice_version }}
          WAVE: ${{ inputs.wave }}
          GROUP: ${{ inputs.group }}
          REASONS: ${{ inputs.reasons }}
          COUNT: ${{ inputs.count }}
          CREATOR_USER_ID: ${{ inputs.creator_user_id }}
          CATEGORIES: ${{ inputs.categories }}
          CREATOR_STATUS: ${{ inputs.creator_status }}
          PUBLIC_NAME: ${{ inputs.public_name }}
          LINK_DAYS: ${{ inputs.link_days }}
          CAMPAIGN: ${{ inputs.campaign }}
          LINK_CODE: ${{ inputs.link_code }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '15'
        run: scripts/db/waitlist-admin.sh
