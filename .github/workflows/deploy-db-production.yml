name: Deploy database to Production

# Applies approved database migrations to the Splitpost PRODUCTION Supabase
# project (splitpost-production, hmrliwoychnqrbbydorg) only. A separate
# workflow, environment, secret and target check from staging
# (deploy-db-staging.yml), so neither can ever reach the other.
#
# It never runs automatically: the founder starts it by hand from the Actions
# tab, on main, types the Production project reference, and approves the
# GitHub "production" environment (required reviewer).
#
# Modes:
#   plan  (default) Verifies everything and lists pending migrations. Changes nothing.
#   apply           Same checks, then applies the pending approved migrations and
#                   runs the security and separation checks against Production.
#                   Also needs the typed phrase APPLY TO PRODUCTION, and a
#                   confirmation that a backup or restore point exists.
#   check           Read-only: runs the security and separation checks and lists
#                   applied migrations. Never runs db push.
#
# Safety:
#   - The only credential is the PRODUCTION_DATABASE_URL secret of the GitHub
#     "production" environment. No other secret or environment is referenced.
#   - The target must match the Production reference hard-coded below, the
#     production environment variable, the reference typed by the person
#     running it, config/supabase-projects.json, and the project named inside
#     the connection string; and it can never be the staging project
#     (scripts/db/verify-production-target.sh).
#   - Migrations must be on the reviewed approved list with matching checksums,
#     and must pass on a throwaway database before Production is touched.
#   - Production receives ONLY the migrations in supabase/production-migrations.txt
#     (the waitlist and its dependencies; not the social core), pushed from a
#     folder holding just those (scripts/db/production-subset.sh), and is
#     checked with supabase/production-checks.txt.
#   - It shares no concurrency group with staging, and has no rollback: the
#     staging rollbacks refuse to run anywhere but staging, by design.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = dry run, no changes. apply = apply approved migrations and run checks. check = read-only security checks only."
        type: choice
        options:
          - plan
          - apply
          - check
        default: plan
        required: true
      confirm_project_ref:
        description: "Type the Production project reference to confirm: hmrliwoychnqrbbydorg"
        type: string
        required: true
      confirm_phrase:
        description: "For apply only, type exactly: APPLY TO PRODUCTION"
        type: string
        required: false
      backup_confirmed:
        description: "For apply only: a current backup or restore point exists for the Production project (Supabase dashboard, Database, Backups)"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-database-production
  cancel-in-progress: false

env:
  # The one project this workflow may ever touch. Changing it requires a reviewed PR.
  EXPECTED_PROJECT_REF: hmrliwoychnqrbbydorg
  # Pinned Supabase CLI, the same version as staging. Update deliberately, in a reviewed PR.
  SUPABASE_CLI_VERSION: 2.122.1

jobs:
  verify-migrations:
    name: Verify approved migrations on a throwaway database
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crevant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: For apply, the typed phrase and the backup confirmation are present
        env:
          MODE: ${{ inputs.mode }}
          PHRASE: ${{ inputs.confirm_phrase }}
          BACKUP: ${{ inputs.backup_confirmed }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "apply" ]; then
            [ "$PHRASE" = "APPLY TO PRODUCTION" ] || { echo "::error::apply needs the phrase APPLY TO PRODUCTION. Nothing was done."; exit 1; }
            [ "$BACKUP" = "true" ] || { echo "::error::apply needs confirmation that a current backup or restore point exists. Nothing was done."; exit 1; }
          fi
          echo "Mode: $MODE"

      - name: Guard tests (target checks and approved list)
        run: scripts/db/test-guards.sh

      - name: Only approved, unchanged migrations are present
        run: scripts/db/check-approved-migrations.sh

      - name: Migrations and security checks pass on an empty database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crevant_test
        run: scripts/db/test.sh

      - name: The Production subset applies on its own and passes its checks (no social core)
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/production_subset
        run: |
          set -euo pipefail
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -q -X -c "create database production_subset"
          scripts/db/production-subset.sh test

  production:
    name: ${{ inputs.mode == 'apply' && 'Apply to Production' || inputs.mode == 'check' && 'Read-only checks on Production' || 'Plan for Production (no changes)' }}
    needs: verify-migrations
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Verify the target is the approved Production project
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          CONFIRM_PROJECT_REF: ${{ inputs.confirm_project_ref }}
        run: scripts/db/verify-production-target.sh

      - name: Only approved, unchanged migrations are present
        run: scripts/db/check-approved-migrations.sh

      - name: Prepare the Production subset (only the listed migrations)
        run: scripts/db/production-subset.sh prepare "$RUNNER_TEMP/production"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the pinned Supabase CLI
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/supabase-cli" "supabase@${SUPABASE_CLI_VERSION}"
          echo "$RUNNER_TEMP/supabase-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Confirm the CLI version
        run: |
          set -euo pipefail
          installed="$(supabase --version | tr -d '[:space:]')"
          if [ "$installed" != "$SUPABASE_CLI_VERSION" ]; then
            echo "::error::Expected Supabase CLI $SUPABASE_CLI_VERSION but found $installed."
            exit 1
          fi
          echo "Supabase CLI $installed"

      - name: Plan (dry run, lists pending migrations, changes nothing)
        if: inputs.mode == 'plan' || inputs.mode == 'apply'
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: supabase --workdir "$RUNNER_TEMP/production" db push --db-url "$PRODUCTION_DATABASE_URL" --dry-run

      - name: Apply approved migrations
        if: inputs.mode == 'apply'
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: supabase --workdir "$RUNNER_TEMP/production" db push --db-url "$PRODUCTION_DATABASE_URL" --yes

      - name: Security and separation checks on Production
        if: inputs.mode == 'apply' || inputs.mode == 'check'
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '15'
        run: |
          set -euo pipefail
          grep -vE '^\s*(#|$)' supabase/production-checks.txt | while read -r c; do
            echo "Running supabase/tests/$c"
            psql "$PRODUCTION_DATABASE_URL" -v ON_ERROR_STOP=1 -q -X -f "supabase/tests/$c"
          done
          echo "Production security and separation checks passed"

      - name: Applied migrations on Production
        if: inputs.mode == 'apply' || inputs.mode == 'check'
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: supabase --workdir "$RUNNER_TEMP/production" migration list --db-url "$PRODUCTION_DATABASE_URL"
