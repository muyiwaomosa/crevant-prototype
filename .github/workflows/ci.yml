name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: App (types, unit tests, build, secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:secrets

  database:
    name: Database (migrations and separation checks)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crevant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Staging deploy guard tests (target check and approved list)
        run: scripts/db/test-guards.sh
      - name: Only approved, unchanged migrations are present
        run: scripts/db/check-approved-migrations.sh
      - name: Apply migrations to an empty database and run checks
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crevant_test
        run: scripts/db/test.sh
