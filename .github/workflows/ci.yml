name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: App (types, unit tests, build, secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the demo branch (a test proves the demo never runs main's build guard)
        run: git fetch --no-tags --depth=1 origin demo:refs/remotes/origin/demo
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:secrets

  public-site:
    # The public site build (npm run build:site): landing page, /join and the
    # sample tour only. Built with made-up Supabase settings present, which
    # must not reach the output; the bundle check fails on any member page,
    # sign in code, Supabase client, project address, key or secret. Then
    # browser checks in Chromium with the vercel.json security headers.
    # Needs no Supabase and no secrets.
    name: Public site (site-only build and browser checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the pinned Playwright and Chromium
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - name: Build the public site, check the bundle, run the browser checks
        run: scripts/e2e/public-site.sh

  database:
    name: Database (migrations and separation checks)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crevant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Staging deploy guard tests (target check and approved list)
        run: scripts/db/test-guards.sh
      - name: Only approved, unchanged migrations are present
        run: scripts/db/check-approved-migrations.sh
      - name: Apply migrations to an empty database and run checks
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crevant_test
        run: scripts/db/test.sh

  integration:
    # Real local Supabase in Docker, isolated to this runner: standard local
    # development keys only, no secrets, never contacts staging. Applies the
    # migrations, then runs scripts/db/integration-test.mjs through real
    # Supabase Auth and the Data API, and the join-waitlist function in
    # Supabase's Edge runtime as the restricted waitlist_writer login
    # (scripts/e2e/waitlist-edge.sh; Turnstile is a stand-in there).
    name: Integration (real local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_CLI_VERSION: 2.122.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned Supabase CLI
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/supabase-cli" "supabase@${SUPABASE_CLI_VERSION}"
          echo "$RUNNER_TEMP/supabase-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Confirm the CLI version
        run: |
          set -euo pipefail
          installed="$(supabase --version | tr -d '[:space:]')"
          if [ "$installed" != "$SUPABASE_CLI_VERSION" ]; then
            echo "::error::Expected Supabase CLI $SUPABASE_CLI_VERSION but found $installed."
            exit 1
          fi
      - name: Start local Supabase (ports reserved, one start-up retry; tests are never retried)
        run: scripts/ci/start-local-supabase.sh
      - name: Staging test-account script against the local stack (create, refuse, clean up)
        run: node scripts/db/test-accounts-local.mjs
      - name: Run the integration test
        run: scripts/db/integration.sh
      - run: npm ci
      - name: Run the waitlist function in the Edge runtime as the restricted login
        run: scripts/e2e/waitlist-edge.sh
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

  browser:
    # The full sign-in journey in a real browser (Chromium) against a real
    # local Supabase in Docker: invitation, Continue, password, sign in and
    # out, password reset, expired and reused links, email-scanner
    # protection, safe redirects, and the vercel.json security headers.
    # Isolated to this runner: local development keys only, never staging.
    name: Browser (sign-in journey on local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_CLI_VERSION: 2.122.1
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the pinned Supabase CLI
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/supabase-cli" "supabase@${SUPABASE_CLI_VERSION}"
          echo "$RUNNER_TEMP/supabase-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Confirm the CLI version
        run: |
          set -euo pipefail
          installed="$(supabase --version | tr -d '[:space:]')"
          if [ "$installed" != "$SUPABASE_CLI_VERSION" ]; then
            echo "::error::Expected Supabase CLI $SUPABASE_CLI_VERSION but found $installed."
            exit 1
          fi
      - name: Install the pinned Playwright and Chromium
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - name: Start local Supabase (ports reserved, one start-up retry; tests are never retried)
        run: scripts/ci/start-local-supabase.sh
      - name: Run the sign-in journey
        run: scripts/e2e/auth-journey.sh
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
