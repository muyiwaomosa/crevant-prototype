name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: App (types, unit tests, build, secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch the demo branch (a test proves the demo never runs main's build guard)
        run: git fetch --no-tags --depth=1 origin demo:refs/remotes/origin/demo
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:secrets
      - name: The Edge Functions' committed project references match config
        run: node scripts/functions/projects-sync.mjs --check

  public-site:
    # The public site build (npm run build:site): landing page, /join and the
    # sample tour only. Built with made-up Supabase settings present, which
    # must not reach the output; the bundle check fails on any member page,
    # sign in code, Supabase client, project address, key or secret. Then
    # browser checks in Chromium with the vercel.json security headers.
    # Needs no Supabase and no secrets.
    name: Public site (site-only build and browser checks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the pinned Playwright and Chromium
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - name: Build the public site, check the bundle, run the browser checks
        run: scripts/e2e/public-site.sh

  database:
    name: Database (migrations and separation checks)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crevant_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Staging deploy guard tests (target check and approved list)
        run: scripts/db/test-guards.sh
      - name: Only approved, unchanged migrations are present
        run: scripts/db/check-approved-migrations.sh
      - name: Apply migrations to an empty database and run checks
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/crevant_test
        run: scripts/db/test.sh
      - name: The atomic staging activation behaves on throwaway databases
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: scripts/db/activation-test.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Supabase CLI version the staging workflow pins
        run: |
          set -euo pipefail
          v="$(grep -E '^  SUPABASE_CLI_VERSION:' .github/workflows/deploy-db-staging.yml | awk '{print $2}')"
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/supabase-cli" "supabase@$v"
      - name: The activation is recognised by the standard Supabase migration tooling
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          SUPABASE: ${{ runner.temp }}/supabase-cli/node_modules/.bin/supabase
        run: scripts/db/activation-cli-compat-test.sh
      # The member Production sequence on throwaway databases: the identity
      # marker, the waitlist login lock (denial tested directly and through a
      # PgBouncer pooler in Docker), the activation, the launch gate and every
      # member check. Last, because it changes the shared waitlist roles while
      # it runs (and restores them).
      - name: The member Production sequence passes end to end
        env:
          ADMIN_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          REQUIRE_POOLER_TEST: '1'
        run: scripts/db/members-workflow-test.sh

  integration:
    # Real local Supabase in Docker, isolated to this runner: standard local
    # development keys only, no secrets, never contacts staging. Applies the
    # migrations, then runs scripts/db/integration-test.mjs through real
    # Supabase Auth and the Data API, and the join-waitlist function in
    # Supabase's Edge runtime as the restricted waitlist_writer login
    # (scripts/e2e/waitlist-edge.sh; Turnstile is a stand-in there, in test
    # code under e2e/ only), the database TLS checks, and the staging rollback
    # tests, all against this runner's own throwaway databases.
    name: Integration (real local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_CLI_VERSION: 2.122.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned Supabase CLI
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/supabase-cli" "supabase@${SUPABASE_CLI_VERSION}"
          echo "$RUNNER_TEMP/supabase-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Confirm the CLI version
        run: |
          set -euo pipefail
          installed="$(supabase --version | tr -d '[:space:]')"
          if [ "$installed" != "$SUPABASE_CLI_VERSION" ]; then
            echo "::error::Expected Supabase CLI $SUPABASE_CLI_VERSION but found $installed."
            exit 1
          fi
      - name: Start local Supabase (ports reserved, one start-up retry; tests are never retried)
        run: scripts/ci/start-local-supabase.sh
      - name: Run the integration test
        run: scripts/db/integration.sh
      - run: npm ci
      # The private test ports helper: a busy port, a stopped copy and a silent
      # copy fail at once with an explanation, and secrets never reach it.
      - name: Private test ports helper (reservation, start-up diagnostics, redaction)
        run: scripts/e2e/lib/private-ports.test.sh
      - name: Run the waitlist function in the Edge runtime as the restricted login
        run: scripts/e2e/waitlist-edge.sh
      # Throwaway local CA and Postgres servers only: proves the database
      # connection verifies the certificate and hostname, and never falls
      # back to plain text or weaker settings.
      - name: Database TLS checks (wrong CA, wrong hostname, no TLS, weakened settings)
        run: scripts/e2e/waitlist-tls.sh
      # Against this runner's local Supabase only: every refusal, a dry run,
      # the real removal, and the migrations applying again cleanly.
      - name: Staging rollback tests on local Supabase (refusals and a clean reapply)
        run: scripts/db/rollback-test.sh
      - name: Publishing on the old and new schema (request id fallback, issue #48)
        run: scripts/db/request-ids-fallback-test.sh
      # After the rollback tests (they need an empty picture store): the avatar
      # Edge Function in the local Edge runtime, through the same gateway the
      # app uses. Image validation, authorization, revocation, the daily
      # limit, overlapping uploads, cleanup, and the Production guard.
      - name: Avatar Edge Function on local Supabase (validation, authorization, cleanup)
        run: scripts/e2e/avatar-edge.sh
      # Photo posts: the post-media Edge Function in the local Edge runtime,
      # through the same gateway. Sign-in on every action, the switch and its
      # processing-check gate, both server-made copies with no metadata,
      # refusals, links, server-controlled deletion (request, scheduled drain
      # with its key), evidence held, and the Production guard.
      - name: Post-media Edge Function on local Supabase (photos, deletion queue, evidence)
        run: scripts/e2e/post-media-edge.sh
      # The staging photo cleanup schedule (pg_cron, the synchronous http
      # extension, Vault): refusals, check, apply; non-200, network failure and
      # the 20 second timeout; real scheduled runs; removal; then the guarded
      # move off pg_net and staging security checks 001 to 013.
      - name: Photo cleanup schedule on local Supabase (http runs, timeout, pg_net removal, checks 001-013)
        run: scripts/db/schedule-media-drain-test.sh
      # The "Photo cleanup schedule check on staging" workflow's wrapper, on
      # local Supabase set up like staging: every refusal before connecting
      # (branch, arguments, credentials, project, TLS, changed script), check
      # mode leaving nothing behind, apply attempts, a committing script
      # caught by the fingerprints, and the 15 minute boundary.
      - name: Photo cleanup schedule check workflow on local Supabase (check only, refusals)
        run: scripts/db/staging-schedule-check-test.sh
      # The "Photo cleanup schedule on staging" and "Remove pg_net from
      # staging" wrappers, on local Supabase set up like staging, with real
      # pg_cron runs against a keyed drain, a 401 and a fake 200: refusals,
      # apply replacing (not duplicating) and verifying the first run against
      # the drain's own record, INSTALLED BUT UNVERIFIED, pause touching only
      # the cleanup job, the two-run removal gate (failed, unmatched and
      # unattributed runs), removal, and checks 001 to 013 afterwards.
      - name: Photo cleanup apply and pg_net removal workflows on local Supabase (gate, verification, pause)
        run: scripts/db/staging-photo-cleanup-test.sh
      # Phase 1B-2: the Edge Functions' project and origin policy and the
      # independent verifier, on the real Edge runtime without a gateway
      # (staging, a test member Production reference, refused projects,
      # join-waitlist identical to main where allowed), then authorization
      # independent of the Origin through the local gateway.
      - name: Edge Function project isolation, origins and the verifier (Edge runtime)
        run: scripts/e2e/functions-policy-edge.sh
      - name: Authorization does not depend on the Origin (local Supabase)
        run: scripts/e2e/functions-policy-local.sh
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

  browser:
    # The full sign-in journey in a real browser (Chromium) against a real
    # local Supabase in Docker: invitation, Continue, password, sign in and
    # out, password reset, expired and reused links, email-scanner
    # protection, safe redirects, and the vercel.json security headers.
    # Isolated to this runner: local development keys only, never staging.
    name: Browser (sign-in journey on local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_CLI_VERSION: 2.122.1
      PLAYWRIGHT_VERSION: 1.63.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the pinned Supabase CLI
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/supabase-cli" "supabase@${SUPABASE_CLI_VERSION}"
          echo "$RUNNER_TEMP/supabase-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Confirm the CLI version
        run: |
          set -euo pipefail
          installed="$(supabase --version | tr -d '[:space:]')"
          if [ "$installed" != "$SUPABASE_CLI_VERSION" ]; then
            echo "::error::Expected Supabase CLI $SUPABASE_CLI_VERSION but found $installed."
            exit 1
          fi
      - name: Install the pinned Playwright and Chromium
        run: |
          set -euo pipefail
          npm install --no-save --no-audit --no-fund "playwright@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - name: Start local Supabase (ports reserved, one start-up retry; tests are never retried)
        run: scripts/ci/start-local-supabase.sh
      - name: Run the sign-in journey
        run: scripts/e2e/auth-journey.sh
      # The waitlist as people use it: the real form in a browser, the real
      # function in the Edge runtime (Turnstile is a stand-in), the local
      # database as the restricted login.
      - name: Run the waitlist journey
        run: scripts/e2e/waitlist-journey.sh
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true
