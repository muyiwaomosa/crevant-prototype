<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" role="img" aria-label="Splitpost">
  <!-- The official Splitpost logo: the split-post badge. Ivory ring, cobalt disc, and one post in two
       pieces (ivory above, seafoam below) with an apricot line behind them, showing only in the gap.
       Geometry matches the original badge exactly: 48px disc, 4px ring, 24 x 21 post, 3px gap. -->
  <defs>
    <clipPath id="sp-logo-top"><polygon points="16,17.5 40,17.5 40,22.45 16,26.5"/></clipPath>
    <clipPath id="sp-logo-bottom"><polygon points="16,33.55 40,29.5 40,38.5 16,38.5"/></clipPath>
  </defs>
  <circle cx="28" cy="28" r="28" fill="#faf7f1"/>
  <circle cx="28" cy="28" r="24" fill="#2447a6"/>
  <rect x="13" y="26.5" width="30" height="3" rx="1.5" fill="#f6b888" transform="rotate(-14 28 28)"/>
  <path clip-path="url(#sp-logo-top)" fill="#faf7f1" d="M16 26.5V20.5a3 3 0 0 1 3-3h18a3 3 0 0 1 3 3V26.5Z"/>
  <path clip-path="url(#sp-logo-bottom)" fill="#a8d9cf" d="M16 29.5H40V35.5a3 3 0 0 1-3 3H19a3 3 0 0 1-3-3Z"/>
</svg>
